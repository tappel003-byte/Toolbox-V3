name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Open pull request for Claude issue branch
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="claude/issue-${ISSUE_NUMBER}-$(date -u +%Y%m%d-%H%M)"
          REMOTE_BRANCH="$(git ls-remote --heads origin "claude/issue-${ISSUE_NUMBER}-*" | awk '{print $2}' | sed 's#refs/heads/##' | tail -n 1)"

          if [ -z "$REMOTE_BRANCH" ]; then
            echo "Claude did not push an issue branch; no PR can be opened."
            exit 1
          fi

          if gh pr list --head "$REMOTE_BRANCH" --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create               --base main               --head "$REMOTE_BRANCH"               --title "Claude implementation for issue #${ISSUE_NUMBER}"               --body "Automated handoff from Claude Code for issue #${ISSUE_NUMBER}. Review repository authority documents and the actual diff before merge."
          else
            echo "An open PR already exists for $REMOTE_BRANCH."
          fi
